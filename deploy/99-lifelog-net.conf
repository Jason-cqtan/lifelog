# Installed to /etc/sysctl.d/ by install.sh.
# The route to mainland China is long (~200 ms) and lossy; ping can't be
# changed from here, but these keep throughput up on such a path.

# BBR keeps sending at the measured bandwidth instead of halving on each loss
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# don't fall back to slow start when a keep-alive connection resumes
net.ipv4.tcp_slow_start_after_idle = 0
# TCP Fast Open for clients and server (saves a round trip on repeat visits)
net.ipv4.tcp_fastopen = 3
# find a working MTU instead of stalling on black-holed large packets
net.ipv4.tcp_mtu_probing = 1
# smaller unsent queue: lower latency for HTTP/2 streams
net.ipv4.tcp_notsent_lowat = 16384

# buffers big enough for bandwidth x 200 ms (modest for a 1 GB box)
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
