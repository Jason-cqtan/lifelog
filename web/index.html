<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lifelog</title>
    <script>
      // Apply the saved theme (or the OS setting) before first paint to avoid a flash.
      ;(function () {
        var t = null
        try { t = localStorage.getItem('theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      })()
    </script>
    <script>
      // Start on data.json now rather than after the app's code has downloaded (App.tsx picks it up).
      // GitHub Pages caches files for 10 min; revalidate so a fresh sync shows up at once.
      window.__dataFetch = fetch('%BASE_URL%data.json', { cache: 'no-cache' })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
